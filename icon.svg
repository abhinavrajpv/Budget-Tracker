<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Ambient Glow Circle -->
  <circle cx="256" cy="240" r="160" fill="url(#glowGrad)" />

  <!-- Shield Shape (Symbolizing 100% Security & Privacy) -->
  <path d="M 256 96 C 330 96 376 130 376 130 C 376 250 330 350 256 394 C 182 350 136 250 136 130 C 136 130 182 96 256 96 Z"
        fill="#1e293b"
        stroke="url(#shieldGrad)"
        stroke-width="10"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Inner Vault Dial / Wallet / Coin Emblem -->
  <!-- Outer Ring -->
  <circle cx="256" cy="240" r="66" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="8" />

  <!-- Central Currency / Growth / Vault Lock Node -->
  <path d="M 256 200 L 256 280" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <path d="M 234 220 L 256 200 L 278 220" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="256" cy="256" r="10" fill="#38bdf8" />

  <!-- Decorative Tick Marks around Vault Dial -->
  <line x1="256" y1="184" x2="256" y2="192" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="288" x2="256" y2="296" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="202" y1="240" x2="210" y2="240" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <line x1="302" y1="240" x2="310" y2="240" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

  <!-- Secure Checkmark at bottom center of Shield -->
  <circle cx="256" cy="336" r="16" fill="#10b981" />
  <polyline points="248 336 254 342 264 330" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
